# Core market dictionary printed at the end of every report.
# Claude adds any extra terms it used that day on top of these.
Share: "A small piece of ownership in a company."
NSE / BSE: "India's two stock exchanges - the marketplaces where shares are bought and sold."
Index: "A basket of stocks whose combined price shows how a part of the market is doing (e.g. Nifty 50)."
Nifty 50: "Index of the 50 biggest companies on NSE. When people say 'the market went up', they usually mean Nifty."
Sensex: "Index of 30 big companies on BSE."
Bank Nifty: "Index of the biggest bank stocks on NSE."
India VIX: "The 'fear index'. Shows how much movement traders expect in the next 30 days. Above ~20 = nervous market."
OHLC: "Open, High, Low, Close - the four key prices of a day (or of any candle)."
Previous Close: "Yesterday's final price. Today's % change is measured from this."
Volume: "Number of shares traded. High volume = lots of interest."
Market Cap: "Share price x total shares = total value of the company."
Candlestick: "A bar showing open, high, low and close. Green = closed higher than it opened, red = closed lower."
Body / Wick: "Body = the thick part between open and close. Wicks (shadows) = thin lines showing the high and low."
Gap Up / Gap Down: "When today's open is above (gap up) or below (gap down) yesterday's close."
Trend: "The general direction of price - up, down or sideways."
Support: "A price 'floor' where buyers stepped in before, stopping a fall."
Resistance: "A price 'ceiling' where sellers stepped in before, stopping a rise."
Breakout / Breakdown: "Price moving above resistance (breakout) or below support (breakdown), ideally on high volume."
DMA (Moving Average): "Average closing price of the last N days. 20 DMA = short-term, 50 DMA = medium, 200 DMA = long-term trend."
Golden Cross / Death Cross: "50 DMA crossing above 200 DMA (golden, bullish) or below it (death, bearish)."
RSI: "Relative Strength Index (0-100) - how fast price has moved. Above 70 overbought, below 30 oversold."
MACD: "Moving Average Convergence Divergence - a momentum tool. MACD line above its signal line = bullish momentum."
ATR: "Average True Range - the stock's normal daily movement in rupees."
VWAP: "Volume Weighted Average Price - the average price paid today, weighted by volume. Big institutions watch it."
Opening Range: "The high and low of the first 15 minutes (9:15-9:30). A move outside it often sets the day's direction."
52-week High / Low: "Highest and lowest price in the last one year."
P/E Ratio: "Price / Earnings per share. How many rupees you pay for Rs 1 of yearly profit."
EPS: "Earnings Per Share - net profit divided by number of shares."
ROE: "Return on Equity - profit as a % of shareholders' money. Above 15% is generally good."
Debt to Equity: "Borrowed money compared with owners' money. Lower = less risky."
Promoter: "The founders / controlling owners of a company."
FII / DII: "Foreign Institutional Investors / Domestic Institutional Investors (mutual funds, LIC etc.) - the 'big money'."
Bullish / Bearish: "Expecting prices to rise (bullish, like a bull's horns going up) or fall (bearish, like a bear's paw swiping down)."
Reversal: "When a trend changes direction."
Confirmation: "Waiting for the next candle(s) to agree with a pattern before trusting it."
Stop-loss: "A pre-decided exit price that limits your loss if the trade goes wrong."
Paper Trading: "Practising trades on paper / in a spreadsheet with pretend money."
